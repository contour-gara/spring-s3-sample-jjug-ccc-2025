services:
  photo-note-api:
    build:
      context: ./photo-note-api
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    healthcheck:
      test: "curl -f http://localhost:8080/actuator/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_KEY: testtest
      AWS_REGION: ap-northeast-1
      AWS_S3_ENDPOINT: http://s3.localhost:9000/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jjug
      SPRING_DATASOURCE_USERNAME: gara
      SPRING_DATASOURCE_PASSWORD: password

  photo-note-frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - 3000:80
    depends_on:
      photo-note-api:
        condition: service_healthy
    environment:
      REACT_APP_API_URL: http://photo-note-api:8080

  mysql:
    image: mysql:latest
    ports:
      - 3306:3306
    environment:
      MYSQL_USER: gara
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: jjug
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    networks:
      default:
        aliases:
          - s3.localhost
          - jjug-ccc-2025.s3.localhost
    ports:
      - 9000:9000
      - 9001:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: testtest
      MINIO_REGION: ap-northeast-1
      MINIO_DOMAIN: s3.localhost
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 test testtest
        mc mb --ignore-existing local/jjug-ccc-2025
