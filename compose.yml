services:
  photo-note-api:
    build:
      context: ./photo-note-api
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    healthcheck:
      test: "curl -f http://localhost:8080/actuator/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      garage:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: testtest
      AWS_SECRET_KEY: testtesttesttest
      AWS_REGION: ap-northeast-1
      AWS_S3_ENDPOINT: http://s3.localhost:9000/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jjug
      SPRING_DATASOURCE_USERNAME: gara
      SPRING_DATASOURCE_PASSWORD: password

  photo-note-frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - 3000:80
    depends_on:
      photo-note-api:
        condition: service_healthy
    environment:
      REACT_APP_API_URL: http://photo-note-api:8080

  mysql:
    image: mysql:latest
    ports:
      - 3306:3306
    environment:
      MYSQL_USER: gara
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: jjug
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s

  garage:
    image: dxflrs/garage:v2.3.0
    networks:
      default:
        aliases:
          - s3.localhost
          - jjug-ccc-2025.s3.localhost
    ports:
      - 9000:9000
      - 3903:3903
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s

  garage-init:
    image: curlimages/curl:latest
    depends_on:
      garage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ADMIN=http://garage:3903
        AUTH="Authorization: Bearer garage-local-admin-token"
        until curl -s -o /dev/null "$$ADMIN/health"; do sleep 1; done
        STATUS=$$(curl -sf -H "$$AUTH" "$$ADMIN/v2/GetClusterStatus")
        LAYOUT_VERSION=$$(echo "$$STATUS" | grep -o '"layoutVersion": *[0-9]*' | grep -o '[0-9]*')
        if [ "$$LAYOUT_VERSION" = "0" ]; then
          NODE_ID=$$(echo "$$STATUS" | grep -o '"id": *"[0-9a-f]*"' | head -n 1 | cut -d '"' -f 4)
          curl -sf -H "$$AUTH" -X POST "$$ADMIN/v2/UpdateClusterLayout" -d "{\"roles\": [{\"id\": \"$$NODE_ID\", \"zone\": \"dc1\", \"capacity\": 1000000000, \"tags\": []}]}" > /dev/null
          curl -sf -H "$$AUTH" -X POST "$$ADMIN/v2/ApplyClusterLayout" -d '{"version": 1}' > /dev/null
        fi
        curl -sf -H "$$AUTH" -X POST "$$ADMIN/v2/ImportKey" -d '{"accessKeyId": "testtest", "secretAccessKey": "testtesttesttest", "name": "local"}' > /dev/null || true
        curl -sf -H "$$AUTH" -X POST "$$ADMIN/v2/UpdateKey?id=testtest" -d '{"allow": {"createBucket": true}}' > /dev/null
        curl -sf --aws-sigv4 "aws:amz:ap-northeast-1:s3" --user "testtest:testtesttesttest" -X PUT "http://garage:9000/jjug-ccc-2025" > /dev/null || true
        curl -sf --aws-sigv4 "aws:amz:ap-northeast-1:s3" --user "testtest:testtesttesttest" -X PUT "http://garage:9000/jjug-ccc-2025?cors" --data-binary '<CORSConfiguration><CORSRule><AllowedOrigin>http://localhost:3000</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedHeader>*</AllowedHeader></CORSRule></CORSConfiguration>' > /dev/null
