services:
  photo-note-api:
    build:
      context: ./photo-note-api
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    healthcheck:
      test: "curl -f http://localhost:8080/actuator/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      floci:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_KEY: test
      AWS_REGION: ap-northeast-1
      AWS_S3_ENDPOINT: http://s3.localhost.floci.io:4566/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jjug
      SPRING_DATASOURCE_USERNAME: gara
      SPRING_DATASOURCE_PASSWORD: password

  photo-note-frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - 3000:80
    depends_on:
      photo-note-api:
        condition: service_healthy
    environment:
      REACT_APP_API_URL: http://photo-note-api:8080

  mysql:
    image: mysql:latest
    ports:
      - 3306:3306
    environment:
      MYSQL_USER: gara
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: jjug
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s

  floci:
    # init_s3.sh でのバケット作成に AWS CLI を使い、healthcheck に curl を使うため compat イメージを指定する。
    # 標準イメージには AWS CLI も curl も入っていないため。
    image: floci/floci:latest-compat
    networks:
      default:
        aliases:
          - s3.localhost.floci.io
          - jjug-ccc-2025.s3.localhost.floci.io
    ports:
      - 4566:4566
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_floci/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./init_s3.sh:/etc/floci/init/ready.d/init_s3.sh
